<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIMBOX - LPZ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body {
            background: #0f172a;
            font-family: sans-serif;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
        }
    </style>
</head>

<body class="p-4 md:p-10">
    <div class="max-w-md mx-auto">
        <h1 class="text-3xl font-bold text-sky-400 mb-8 border-b border-slate-700 pb-4 text-center">
            BIMBOX <span class="text-white font-light">LPZ</span>
        </h1>

        <div id="grid" class="space-y-6">
        </div>
    </div>

    <script>
        // DATOS DEL PROYECTO
        const datos = [
            {
                id: "01",
                nivel: "ESTRUCTURA",
                nombre: "MODELO REAL RA",
                link3d: "https://autode.sk/4d5P1kx",
                archivoGlb: "modelo.glb", // Asegúrate que en GitHub se llame igual
                estado: "OK"
            }
        ];

        const grid = document.getElementById('grid');
        grid.innerHTML = datos.map(proyecto => `
            <div class="card p-6 rounded-2xl shadow-2xl">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <p class="text-xs font-bold text-sky-400 uppercase tracking-widest">${proyecto.nivel}</p>
                        <h3 class="text-xl font-bold text-white">${proyecto.nombre}</h3>
                    </div>
                    <span class="px-2 py-1 bg-green-500/20 text-green-400 text-xs font-bold rounded border border-green-500/50">
                        ${proyecto.estado}
                    </span>
                </div>
                
                <div class="flex flex-col gap-3">
                    <a href="${proyecto.link3d}" target="_blank" 
                       class="block w-full text-center bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">
                        VISOR 3D (AUTODESK)
                    </a>
                    
                    <model-viewer 
                        src="${proyecto.archivoGlb}" 
                        ar 
                        ar-modes="webxr scene-viewer quick-look" 
                        camera-controls 
                        shadow-intensity="1" 
                        style="width: 100%; height: 50px; background-color: #10b981; border-radius: 12px;">
                        <button slot="ar-button" style="width: 100%; height: 100%; border: none; background: transparent; color: white; font-weight: bold; font-size: 14px;">
                            🤳 PROYECTAR EN OBRA (RA)
                        </button>
                    </model-viewer>
                </div>
            </div>
        `).join('');
    </script>
</body>

</html>
